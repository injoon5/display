name: CI

on:
  pull_request:
  push:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # compiler/dist is gitignored, and convex/ + web/ import @matrix-panel/compiler
      # for its types, so typechecking needs the build first (same as cards.yml).
      - name: Build compiler package
        run: npm run build -w compiler

      - name: Typecheck workspaces and Convex
        run: npm run typecheck

      - name: Run compiler tests
        run: npm run test
